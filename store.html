<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线下门店 - 全国200+城市服务网点 | 优车汇二手车</title>
<meta name="keywords" content="二手车门店,二手车交易市场,优车汇门店,二手车到店看车,二手车交易中心">
<meta name="description" content="优车汇全国线下门店，覆盖北京、上海、广州、深圳、杭州、成都、武汉、西安、南京、重庆等200+城市，支持到店看车、上门验车、代办过户与异地交付。">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="store">

<!-- ============ 顶部导航（由 main.js 统一渲染） ============ -->
<header id="siteHeader"></header>

<main class="page-main">

  <!-- ===================== 页面 Hero ===================== -->
  <section class="static-hero">
    <div class="container">
      <h1>全国线下门店</h1>
      <p>优车汇已在全国 200+ 城市布局线下服务网点，支持到店看车、上门验车、代办过户与异地交付。每一家门店均配备资深评估师与专属购车顾问，为你提供 1 对 1 全程陪同服务，看得见、摸得着，买得放心。</p>
    </div>
  </section>

  <div class="container" style="padding-top:18px;padding-bottom:60px">

    <!-- 面包屑 -->
    <nav class="breadcrumb">
      <a href="index.html">首页</a><span class="sep">/</span>
      <span>线下门店</span>
    </nav>

    <!-- 门店服务数据 -->
    <div class="about-stats mb24" id="storeStats"><!-- JS 渲染 --></div>

    <!-- 城市快捷筛选 -->
    <div class="zone-tabs mb24" id="storeCityTabs"><!-- JS 渲染 --></div>

    <!-- 门店列表 -->
    <div id="storeList"><!-- JS 渲染门店大卡 --></div>

    <!-- 到店服务 -->
    <section class="section" style="padding-bottom:0">
      <div class="section-head">
        <div>
          <h2 class="section-title">到店服务<small>In-store Service</small></h2>
          <p class="section-sub">到店即可享受评估、试驾、金融、过户一站式服务，全程有专人陪同</p>
        </div>
      </div>
      <div class="service-grid" id="storeServices"><!-- JS 渲染 --></div>
    </section>

  </div>
</main>

<!-- ============ 页脚（由 main.js 统一渲染） ============ -->
<footer id="siteFooter"></footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
