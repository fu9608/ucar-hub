<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 - 我的收藏 / 预约记录 / 卖车信息 | 优车汇二手车</title>
<meta name="description" content="优车汇个人中心：查看我的收藏车辆、看车预约记录、浏览历史、我发布的卖车信息，并管理个人资料。">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="user">

<!-- ============ 顶部导航 ============ -->
<header id="siteHeader"></header>

<main class="page-main">
  <div class="container" style="padding-top:18px;padding-bottom:60px">

    <nav class="breadcrumb">
      <a href="index.html">首页</a><span class="sep">/</span><span>个人中心</span>
    </nav>

    <!-- ============ 未登录提示（未登录时展示） ============ -->
    <div class="card" id="guestPanel" style="padding:60px 30px;text-align:center;display:none">
      <div class="empty-icon" style="width:96px;height:96px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="empty-title" style="font-size:19px">你还没有登录</div>
      <p style="color:var(--muted);margin:10px 0 24px">登录后可查看我的收藏、看车预约记录、浏览历史与卖车信息</p>
      <button class="btn btn-primary btn-lg" data-login>立即登录 / 注册</button>
    </div>

    <!-- ============ 个人中心主体（登录后展示） ============ -->
    <div class="user-layout" id="userLayout" style="display:none">

      <!-- 左侧菜单 -->
      <aside class="user-side">
        <div class="user-profile">
          <div class="ava" id="userAva">U</div>
          <div>
            <div class="u-name" id="userName">用户</div>
            <div class="u-phone" id="userPhone">—</div>
          </div>
        </div>
        <nav class="user-menu" id="userMenu">
          <a href="#overview" data-panel="overview">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
            个人概览</a>
          <a href="#fav" data-panel="fav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
            我的收藏 <span class="count" id="menuFavCount">0</span></a>
          <a href="#appt" data-panel="appt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M3 11h18"/></svg>
            看车预约记录 <span class="count" id="menuApptCount">0</span></a>
          <a href="#history" data-panel="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg>
            浏览历史 <span class="count" id="menuHisCount">0</span></a>
          <a href="#sale" data-panel="sale"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.6 2.6 21 11a2 2 0 0 1 0 2.8L13.8 21a2 2 0 0 1-2.8 0L2.6 12.6A2 2 0 0 1 2 11.2V4a2 2 0 0 1 2-2h7.2a2 2 0 0 1 1.4.6Z"/><circle cx="7.5" cy="7.5" r="1.5" fill="currentColor"/></svg>
            我发布的卖车信息 <span class="count" id="menuSaleCount">0</span></a>
          <a href="#profile" data-panel="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            修改个人资料</a>
          <a href="javascript:;" id="logoutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
            退出登录</a>
        </nav>
      </aside>

      <!-- 右侧内容 -->
      <div class="user-content">

        <!-- 个人概览 -->
        <section class="user-panel active" id="panel-overview">
          <div class="stat-cards">
            <div class="stat-card"><div class="num" id="ovFav">0</div><div class="label">收藏车辆</div></div>
            <div class="stat-card accent"><div class="num" id="ovAppt">0</div><div class="label">看车预约</div></div>
            <div class="stat-card"><div class="num" id="ovHis">0</div><div class="label">浏览记录</div></div>
            <div class="stat-card"><div class="num" id="ovSale">0</div><div class="label">卖车信息</div></div>
          </div>
          <div class="card" style="padding:20px">
            <div class="info-card-head" style="margin-bottom:14px"><h3 style="font-size:16px">最近浏览</h3>
              <a class="section-more" href="#history" data-jump="history">全部记录 →</a></div>
            <div id="ovRecent"></div>
          </div>
        </section>

        <!-- 我的收藏 -->
        <section class="user-panel" id="panel-fav">
          <div class="info-card-head"><h3>我的收藏</h3><a class="section-more" href="list.html">继续逛车源 →</a></div>
          <div class="car-grid car-grid-3" id="favList"></div>
        </section>

        <!-- 看车预约记录 -->
        <section class="user-panel" id="panel-appt">
          <div class="info-card-head"><h3>看车预约记录</h3><span class="hint">门店顾问将在预约时间前与您电话确认</span></div>
          <div class="record-list" id="apptList"></div>
        </section>

        <!-- 浏览历史 -->
        <section class="user-panel" id="panel-history">
          <div class="info-card-head"><h3>浏览历史</h3>
            <span class="section-more" id="clearHis">清空浏览记录</span></div>
          <div class="record-list" id="hisList"></div>
        </section>

        <!-- 我发布的卖车信息 -->
        <section class="user-panel" id="panel-sale">
          <div class="info-card-head"><h3>我发布的卖车信息</h3>
            <a class="btn btn-accent btn-sm" href="sellcar.html">+ 发布卖车信息</a></div>
          <div class="record-list" id="saleList"></div>
        </section>

        <!-- 修改个人资料 -->
        <section class="user-panel" id="panel-profile">
          <div class="info-card-head"><h3>修改个人资料</h3></div>
          <form class="form-card" id="profileForm" style="border:none;box-shadow:none;padding:0">
            <div class="form-row">
              <div class="form-item"><label class="form-label">昵称<span class="req">*</span></label>
                <input class="form-control" name="name" placeholder="请输入昵称" data-rule="required"></div>
              <div class="form-item"><label class="form-label">手机号码</label>
                <input class="form-control" name="phone" disabled style="background:var(--bg-soft);color:var(--muted)"></div>
            </div>
            <div class="form-row">
              <div class="form-item"><label class="form-label">真实姓名</label>
                <input class="form-control" name="realName" placeholder="用于过户与合同签署（选填）"></div>
              <div class="form-item"><label class="form-label">所在城市</label>
                <select class="form-control" name="city" id="profileCity"></select></div>
            </div>
            <div class="form-row">
              <div class="form-item"><label class="form-label">意向品牌</label>
                <select class="form-control" name="intentBrand" id="profileBrand"></select></div>
              <div class="form-item"><label class="form-label">电子邮箱</label>
                <input class="form-control" name="email" placeholder="用于接收车辆报告（选填）"></div>
            </div>
            <div class="form-item"><label class="form-label">购车需求备注</label>
              <textarea class="form-control" name="remark" placeholder="如：预算 15 万以内、SUV、自动挡、车龄 5 年内"></textarea></div>
            <button type="submit" class="btn btn-primary btn-lg">保存修改</button>
          </form>
        </section>

      </div>
    </div>
  </div>
</main>

<!-- ============ 页脚 ============ -->
<footer id="siteFooter"></footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/user.js"></script>
</body>
</html>
